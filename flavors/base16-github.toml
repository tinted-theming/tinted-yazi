[mgr]
cwd = { fg = "#1b7c83" }

find_keyword = { bold = true, fg = "#9a6700" }
find_position = { fg = "#8250df" }

marker_copied = { fg = "#116329", bg = "#116329" }
marker_cut = { fg = "#cf222e", bg = "#cf222e" }
marker_selected = { fg = "#9a6700", bg = "#9a6700" }

count_copied = { fg = "#ffffff", bg = "#116329" }
count_cut = { fg = "#ffffff", bg = "#cf222e" }
count_selected = { fg = "#ffffff", bg = "#9a6700" }

border_style = { fg = "#0969da" }

[tabs]
active = { fg = "#ffffff", bg = "#0969da"}
inactive = { fg = "#0969da", bg = "#f6f8fa" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[mode]
normal_main = { fg = "#ffffff", bg = "#0969da", bold = true }
normal_alt = { fg = "#0969da", bg = "#d1d9e0" }

select_alt = { fg = "#8250df", bg = "#d1d9e0" }
select_main = { fg = "#ffffff", bg = "#8250df", bold = true }

unset_main = { fg = "#ffffff", bg = "#cf222e", bold = true }
unset_alt = { fg = "#cf222e", bg = "#d1d9e0" }

[status]
perm_exec = { fg = "#116329" }
perm_read = { fg = "#9a6700" }
perm_sep = { fg = "#1b7c83" }
perm_type = { fg = "#0969da" }
perm_write = { fg = "#cf222e" }

progress_error = { fg = "#cf222e", bg = "#ffffff" }
progress_label = { fg = "#454c54", bg = "#ffffff" }
progress_normal = { fg = "#454c54", bg = "#ffffff" }

[pick]
active = { fg = "#8250df" }
border = { fg = "#0969da" }
inactive = { fg = "#454c54" }

[task]
title = { fg = "#0969da" }
border = { fg = "#0969da" }
hovered = { fg = "#454c54", bg = "#d1d9e0" }

[input]
border = { fg = "#0969da" }
selected = { bg = "#d1d9e0" }

[help]
desc = { fg = "#454c54" }
on = { fg = "#1b7c83" }
run = { fg = "#8250df" }
hovered = { reversed = true, bold = true }
footer = { fg = "#d1d9e0", bg = "#454c54" }

[which]
mask = { bg = "#d1d9e0" }
desc = { fg = "#454c54" }
cand = { fg = "#1b7c83" }
rest = { fg = "#a40e26" }

separator_style = { fg = "#59636e" }

[notify]
title_info = { fg = "#1b7c83" }
title_warn = { fg = "#9a6700" }
title_error = { fg = "#cf222e" }
 
[filetype]
rules = [
  { mime = "image/*", fg = "#1b7c83" },
  { mime = "{audio, video}/*", fg = "#9a6700" },
   
  { mime = "application/{pdf,doc,rtf}", fg = "#116329" },
  
  { mime = "application/" },
  
  { url = "*/", fg = "#0969da" },
  { mime = "*", fg = "#454c54" },
]

