[mgr]
cwd = { fg = "#88c0d0" }

find_keyword = { bold = true, fg = "#ebcb8b" }
find_position = { fg = "#b48ead" }

marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
marker_selected = { fg = "#ebcb8b", bg = "#ebcb8b" }

count_copied = { fg = "#2e3440", bg = "#a3be8c" }
count_cut = { fg = "#2e3440", bg = "#bf616a" }
count_selected = { fg = "#2e3440", bg = "#ebcb8b" }

border_style = { fg = "#81a1c1" }

[tabs]
active = { fg = "#2e3440", bg = "#81a1c1"}
inactive = { fg = "#81a1c1", bg = "#39404f" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[mode]
normal_main = { fg = "#2e3440", bg = "#81a1c1", bold = true }
normal_alt = { fg = "#81a1c1", bg = "#444c5e" }

select_alt = { fg = "#b48ead", bg = "#444c5e" }
select_main = { fg = "#2e3440", bg = "#b48ead", bold = true }

unset_main = { fg = "#2e3440", bg = "#bf616a", bold = true }
unset_alt = { fg = "#bf616a", bg = "#444c5e" }

[status]
perm_exec = { fg = "#a3be8c" }
perm_read = { fg = "#ebcb8b" }
perm_sep = { fg = "#88c0d0" }
perm_type = { fg = "#81a1c1" }
perm_write = { fg = "#bf616a" }

progress_error = { fg = "#bf616a", bg = "#2e3440" }
progress_label = { fg = "#cdcecf", bg = "#2e3440" }
progress_normal = { fg = "#cdcecf", bg = "#2e3440" }

[pick]
active = { fg = "#b48ead" }
border = { fg = "#81a1c1" }
inactive = { fg = "#cdcecf" }

[task]
title = { fg = "#81a1c1" }
border = { fg = "#81a1c1" }
hovered = { fg = "#cdcecf", bg = "#444c5e" }

[input]
border = { fg = "#81a1c1" }
selected = { bg = "#444c5e" }

[help]
desc = { fg = "#cdcecf" }
on = { fg = "#88c0d0" }
run = { fg = "#b48ead" }
hovered = { reversed = true, bold = true }
footer = { fg = "#444c5e", bg = "#cdcecf" }

[which]
mask = { bg = "#444c5e" }
desc = { fg = "#cdcecf" }
cand = { fg = "#88c0d0" }
rest = { fg = "#bf88bc" }

separator_style = { fg = "#7e8188" }

[notify]
title_info = { fg = "#88c0d0" }
title_warn = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }
 
[filetype]
rules = [
  { mime = "image/*", fg = "#88c0d0" },
  { mime = "{audio, video}/*", fg = "#ebcb8b" },
   
  { mime = "application/{pdf,doc,rtf}", fg = "#a3be8c" },
  
  { mime = "application/" },
  
  { url = "*/", fg = "#81a1c1" },
  { mime = "*", fg = "#cdcecf" },
]

