[mgr]
cwd = { fg = "#39c5cf" }

find_keyword = { bold = true, fg = "#d29922" }
find_position = { fg = "#be8fff" }

marker_copied = { fg = "#3fb950", bg = "#3fb950" }
marker_cut = { fg = "#ff7b72", bg = "#ff7b72" }
marker_selected = { fg = "#d29922", bg = "#d29922" }

count_copied = { fg = "#0d1117", bg = "#3fb950" }
count_cut = { fg = "#0d1117", bg = "#ff7b72" }
count_selected = { fg = "#0d1117", bg = "#d29922" }

border_style = { fg = "#58a6ff" }

[tabs]
active = { fg = "#0d1117", bg = "#58a6ff"}
inactive = { fg = "#58a6ff", bg = "#151b23" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[mode]
normal_main = { fg = "#0d1117", bg = "#58a6ff", bold = true }
normal_alt = { fg = "#58a6ff", bg = "#2f3742" }

select_alt = { fg = "#be8fff", bg = "#2f3742" }
select_main = { fg = "#0d1117", bg = "#be8fff", bold = true }

unset_main = { fg = "#0d1117", bg = "#ff7b72", bold = true }
unset_alt = { fg = "#ff7b72", bg = "#2f3742" }

[status]
perm_exec = { fg = "#3fb950" }
perm_read = { fg = "#d29922" }
perm_sep = { fg = "#39c5cf" }
perm_type = { fg = "#58a6ff" }
perm_write = { fg = "#ff7b72" }

progress_error = { fg = "#ff7b72", bg = "#0d1117" }
progress_label = { fg = "#d1d7e0", bg = "#0d1117" }
progress_normal = { fg = "#d1d7e0", bg = "#0d1117" }

[pick]
active = { fg = "#be8fff" }
border = { fg = "#58a6ff" }
inactive = { fg = "#d1d7e0" }

[task]
title = { fg = "#58a6ff" }
border = { fg = "#58a6ff" }
hovered = { fg = "#d1d7e0", bg = "#2f3742" }

[input]
border = { fg = "#58a6ff" }
selected = { bg = "#2f3742" }

[help]
desc = { fg = "#d1d7e0" }
on = { fg = "#39c5cf" }
run = { fg = "#be8fff" }
hovered = { reversed = true, bold = true }
footer = { fg = "#2f3742", bg = "#d1d7e0" }

[which]
mask = { bg = "#2f3742" }
desc = { fg = "#d1d7e0" }
cand = { fg = "#39c5cf" }
rest = { fg = "#ffa198" }

separator_style = { fg = "#9198a1" }

[notify]
title_info = { fg = "#39c5cf" }
title_warn = { fg = "#d29922" }
title_error = { fg = "#ff7b72" }
 
[filetype]
rules = [
  { mime = "image/*", fg = "#39c5cf" },
  { mime = "{audio, video}/*", fg = "#d29922" },
   
  { mime = "application/{pdf,doc,rtf}", fg = "#3fb950" },
  
  { mime = "application/" },
  
  { url = "*/", fg = "#58a6ff" },
  { mime = "*", fg = "#d1d7e0" },
]

