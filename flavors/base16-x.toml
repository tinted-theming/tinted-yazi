[mgr]
cwd = { fg = "#5ad4e6" }

find_keyword = { bold = true, fg = "#fce566" }
find_position = { fg = "#948ae3" }

marker_copied = { fg = "#7bd88f", bg = "#7bd88f" }
marker_cut = { fg = "#fc618d", bg = "#fc618d" }
marker_selected = { fg = "#fce566", bg = "#fce566" }

count_copied = { fg = "#050505", bg = "#7bd88f" }
count_cut = { fg = "#050505", bg = "#fc618d" }
count_selected = { fg = "#050505", bg = "#fce566" }

border_style = { fg = "#fd9353" }

[tabs]
active = { fg = "#050505", bg = "#fd9353"}
inactive = { fg = "#fd9353", bg = "#161616" }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[mode]
normal_main = { fg = "#050505", bg = "#fd9353", bold = true }
normal_alt = { fg = "#fd9353", bg = "#222123" }

select_alt = { fg = "#948ae3", bg = "#222123" }
select_main = { fg = "#050505", bg = "#948ae3", bold = true }

unset_main = { fg = "#050505", bg = "#fc618d", bold = true }
unset_alt = { fg = "#fc618d", bg = "#222123" }

[status]
perm_exec = { fg = "#7bd88f" }
perm_read = { fg = "#fce566" }
perm_sep = { fg = "#5ad4e6" }
perm_type = { fg = "#fd9353" }
perm_write = { fg = "#fc618d" }

progress_error = { fg = "#fc618d", bg = "#050505" }
progress_label = { fg = "#f7f1ff", bg = "#050505" }
progress_normal = { fg = "#f7f1ff", bg = "#050505" }

[pick]
active = { fg = "#948ae3" }
border = { fg = "#fd9353" }
inactive = { fg = "#f7f1ff" }

[task]
title = { fg = "#fd9353" }
border = { fg = "#fd9353" }
hovered = { fg = "#f7f1ff", bg = "#222123" }

[input]
border = { fg = "#fd9353" }
selected = { bg = "#222123" }

[help]
desc = { fg = "#f7f1ff" }
on = { fg = "#5ad4e6" }
run = { fg = "#948ae3" }
hovered = { reversed = true, bold = true }
footer = { fg = "#222123", bg = "#f7f1ff" }

[which]
mask = { bg = "#222123" }
desc = { fg = "#f7f1ff" }
cand = { fg = "#5ad4e6" }
rest = { fg = "#a66c51" }

separator_style = { fg = "#8a878e" }

[notify]
title_info = { fg = "#5ad4e6" }
title_warn = { fg = "#fce566" }
title_error = { fg = "#fc618d" }
 
[filetype]
rules = [
  { mime = "image/*", fg = "#5ad4e6" },
  { mime = "{audio, video}/*", fg = "#fce566" },
   
  { mime = "application/{pdf,doc,rtf}", fg = "#7bd88f" },
  
  { mime = "application/" },
  
  { url = "*/", fg = "#fd9353" },
  { mime = "*", fg = "#f7f1ff" },
]

